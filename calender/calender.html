<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fdf9f5;
  color: #333;
  padding: 32px;
}

.page-title {
  font-family: Georgia, serif;
  font-size: 32px;
  font-weight: normal;
  color: #555;
  margin-bottom: 32px;
}

/* ===== メインレイアウト ===== */
.cal-layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 36px;
  align-items: start;
}
@media (max-width: 900px) { .cal-layout { grid-template-columns: 1fr; } }

/* ===== カレンダー本体 ===== */
.cal-card {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.cal-nav {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}
.cal-month-title {
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: normal;
  color: #555;
  flex: 1;
  text-align: center;
}
.cal-nav-btn {
  background: #FFF4B3;
  border: none;
  border-radius: 8px;
  width: 36px; height: 36px;
  font-size: 20px; color: #666;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.15s;
}
.cal-nav-btn:hover { background: #f5e890; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal-weekday {
  text-align: center; font-size: 12px;
  color: #999; padding: 6px 0 10px;
  font-weight: bold;
}
.cal-weekday.sun { color: #d08080; }
.cal-weekday.sat { color: #8090c0; }

.cal-cell {
  min-height: 64px;
  padding: 5px 6px 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
}
.cal-cell:hover { background: #FFF4B3; }
.cal-cell.empty { cursor: default; pointer-events: none; }
.cal-cell.today {
  background: #FFF4B3;
  outline: 2px solid #f0d040;
  outline-offset: -1px;
}
.cal-cell.has-event { background: #fdf5ff; }
.cal-cell.has-deadline { background: #fff5f5; }
.cal-cell.sun .cal-day-num { color: #d08080; }
.cal-cell.sat .cal-day-num { color: #8090c0; }
.cal-day-num { font-size: 13px; font-weight: bold; color: #333; }

/* セル内のイベントドット／ラベル */
.cal-events {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 3px;
}
.cal-event-chip {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  font-weight: 500;
}
.chip-deadline { background: #FFB3B3; color: #7a2020; }
.chip-alarm    { background: #A6D8E4; color: #1a4a5a; }

/* ===== 右サイドパネル ===== */
.cal-side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.side-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 22px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.side-card-title {
  font-family: Georgia, serif;
  font-size: 17px;
  font-weight: normal;
  color: #555;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #FFF4B3;
}

/* フォーム共通 */
.form-fields { display: flex; flex-direction: column; gap: 10px; }
.form-label {
  font-size: 12px; color: #888;
  display: flex; flex-direction: column; gap: 4px;
}
.form-label input,
.form-label select,
.form-label textarea {
  padding: 8px 10px;
  border: 1px solid #e0ddd8;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: #fdf9f5;
  color: #333;
  transition: border-color 0.15s;
}
.form-label input:focus,
.form-label select:focus,
.form-label textarea:focus {
  outline: none;
  border-color: #A6D8E4;
  box-shadow: 0 0 0 3px rgba(166,216,228,0.25);
  background: #fff;
}
.form-label textarea { resize: vertical; min-height: 56px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.add-btn {
  width: 100%; padding: 10px;
  border: none; border-radius: 8px;
  font-size: 14px; font-family: inherit;
  cursor: pointer; font-weight: bold;
  margin-top: 4px; transition: background 0.15s;
}
.add-btn-deadline { background: #FFB3B3; color: #5a1a1a; }
.add-btn-deadline:hover { background: #f09090; }
.add-btn-alarm    { background: #A6D8E4; color: #1a3a4a; }
.add-btn-alarm:hover    { background: #88c4d8; }

/* リスト共通 */
.item-list { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.item-empty { font-size: 13px; color: #ccc; text-align: center; padding: 14px 0; }

.deadline-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: #fff8f8; border: 1px solid #FFB3B3;
}
.deadline-item.past { opacity: 0.45; }
.deadline-item.urgent { background: #fff0f0; border-color: #f08080; }
.deadline-item.done { background: #f5faf5; border-color: #b8dcb8; opacity: 0.6; }
.deadline-item.done .item-title { text-decoration: line-through; }

.alarm-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: #f5fbfd; border: 1px solid #A6D8E4;
}
.alarm-item.past { opacity: 0.45; }

.item-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 14px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-time  { font-size: 12px; color: #999; margin-top: 2px; }
.item-memo  { font-size: 12px; color: #bbb; margin-top: 1px; }
.item-delete {
  background: none; border: none; color: #ccc;
  font-size: 14px; cursor: pointer; padding: 2px 5px;
  border-radius: 4px; flex-shrink: 0;
}
.item-delete:hover { background: #fde4e4; color: #d07070; }
.item-complete {
  background: none; border: none; color: #ccc;
  font-size: 14px; cursor: pointer; padding: 2px 5px;
  border-radius: 4px; flex-shrink: 0;
}
.item-complete:hover { background: #e4fde8; color: #4caf50; }
.item-complete.is-done { color: #4caf50; }

/* 締め切りバッジ */
.deadline-badge {
  display: inline-block; font-size: 10px; padding: 1px 6px;
  border-radius: 4px; font-weight: bold; margin-left: 6px;
}
.badge-urgent { background: #FFB3B3; color: #7a2020; }
.badge-soon   { background: #FFC8A2; color: #6a2a10; }
.badge-ok     { background: #CBE6B2; color: #2a4a1a; }

/* 発火バナー */
#alarm-fire-banner {
  position: fixed; top: 16px; right: 16px; z-index: 1000;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#alarm-fire-banner.active { opacity: 1; pointer-events: auto; }
.alarm-fire-card {
  background: #fff; border: 2px solid #A6D8E4; border-radius: 12px;
  padding: 14px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  display: flex; align-items: flex-start; gap: 12px; max-width: 300px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { transform: translateX(40px); opacity:0; } to { transform: translateX(0); opacity:1; } }
.alarm-fire-icon { font-size: 26px; }
.alarm-fire-body { flex: 1; }
.alarm-fire-body strong { font-size: 15px; color: #333; display: block; }
.alarm-fire-body span   { font-size: 13px; color: #666; }
.alarm-fire-dismiss { background: none; border: none; color: #ccc; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<h1 class="page-title" id="page-title">Calendar</h1>
<div id="alarm-fire-banner"></div>

<div class="cal-layout">

  <!-- 左：カレンダー本体 -->
  <div class="cal-card">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
      <h2 class="cal-month-title" id="cal-month-label"></h2>
      <button class="cal-nav-btn" id="cal-next">&#8250;</button>
    </div>
    <div id="cal-grid-area"></div>
  </div>

  <!-- 右：登録パネル -->
  <div class="cal-side">

    <!-- 締め切り追加 -->
    <div class="side-card">
      <h3 class="side-card-title">📌 締め切りを登録</h3>
      <form id="deadline-form" class="form-fields">
        <label class="form-label">タイトル
          <input id="dl-title" type="text" placeholder="例：レポート提出" required>
        </label>
        <div class="form-row">
          <label class="form-label">日付
            <input id="dl-date" type="date" required>
          </label>
          <label class="form-label">時刻
            <input id="dl-time" type="time" value="23:59">
          </label>
        </div>
        <label class="form-label">メモ（任意）
          <input id="dl-memo" type="text" placeholder="科目名・提出場所など">
        </label>
        <button type="submit" class="add-btn add-btn-deadline">＋ 締め切りを追加</button>
      </form>
    </div>

    <!-- 締め切り一覧 -->
    <div class="side-card">
      <h3 class="side-card-title">📋 締め切り一覧</h3>
      <div id="deadline-list" class="item-list"></div>
    </div>

    <!-- アラーム追加 -->
    <div class="side-card">
      <h3 class="side-card-title">⏰ アラームを設定</h3>
      <form id="alarm-form" class="form-fields">
        <label class="form-label">タイトル
          <input id="al-title" type="text" placeholder="例：ゼミ開始30分前" required>
        </label>
        <div class="form-row">
          <label class="form-label">日付
            <input id="al-date" type="date" required>
          </label>
          <label class="form-label">時刻
            <input id="al-time" type="time" required>
          </label>
        </div>
        <label class="form-label">繰り返し
          <select id="al-repeat">
            <option value="none">なし</option>
            <option value="daily">毎日</option>
            <option value="weekly">毎週</option>
          </select>
        </label>
        <button type="submit" class="add-btn add-btn-alarm">＋ アラームを追加</button>
      </form>
    </div>

    <!-- アラーム一覧 -->
    <div class="side-card">
      <h3 class="side-card-title">🔔 アラーム一覧</h3>
      <div id="alarm-list" class="item-list"></div>
    </div>

  </div>
</div>

<script>
// ===== ストレージ =====
// マイページの各カテゴリーから開かれた場合（?category=ID）は、カテゴリーごとに
// データが混ざらないよう、保存キーの末尾にカテゴリーIDを付ける。
// 単体でこのページを開いた場合（従来通り）は共通のキーのまま動く。
const categoryId = new URLSearchParams(location.search).get('category');
const keySuffix = categoryId ? '_' + categoryId : '';
const DL_KEY  = 'tb_deadlines' + keySuffix;
const ALM_KEY = 'tb_calendar_alarms' + keySuffix;
const FIRED_KEY = 'tb_fired_alarms' + keySuffix;

// マイページ（categoryId付き）に埋め込まれているときは、マイページ側の
// タブ見出し「Calendar」とタイトルが二重に表示されてしまうので、このページ自身の
// 見出しは非表示にする。単体でこのページを直接開いた場合は今まで通り表示する。
if (categoryId) {
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.style.display = 'none';
}

function load(key)   { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function save(key,v) { localStorage.setItem(key, JSON.stringify(v)); }

let firedAlarms = new Set(load(FIRED_KEY));

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 日付ユーティリティ =====
function toDatetimeStr(date, time) { return date + 'T' + time; }
function nowStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    +'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function displayDatetime(dt) {
  const d = new Date(dt);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '
    +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function dateOnly(dt) { return dt.slice(0,10); }

function deadlineBadge(dt) {
  const now = new Date();
  const target = new Date(dt);
  const diff = (target - now) / 3600000; // 時間差
  if (diff < 0)   return '<span class="deadline-badge badge-urgent">期限切れ</span>';
  if (diff < 24)  return '<span class="deadline-badge badge-urgent">本日！</span>';
  if (diff < 72)  return '<span class="deadline-badge badge-soon">あと'+Math.ceil(diff/24)+'日</span>';
  return '<span class="deadline-badge badge-ok">あと'+Math.ceil(diff/24)+'日</span>';
}

// ===== カレンダー =====
let currentYear, currentMonth;
(function(){ const n=new Date(); currentYear=n.getFullYear(); currentMonth=n.getMonth(); })();

function renderCalendarGrid() {
  const deadlines = load(DL_KEY);
  const alarms    = load(ALM_KEY);
  const firstDay  = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const todayStr  = new Date().toISOString().slice(0,10);

  // 日付マップ
  const dlMap = {}, almMap = {};
  deadlines.forEach(d => { const k=dateOnly(d.datetime); if(!dlMap[k])dlMap[k]=[]; dlMap[k].push(d); });
  alarms.forEach(a    => { const k=dateOnly(a.datetime); if(!almMap[k])almMap[k]=[]; almMap[k].push(a); });

  const wk = ['日','月','火','水','木','金','土'];
  let html = '<div class="cal-grid">';
  wk.forEach((w,i) => html += `<div class="cal-weekday ${i===0?'sun':i===6?'sat':''}">${w}</div>`);
  for(let i=0;i<firstDay;i++) html += '<div class="cal-cell empty"></div>';

  for(let d=1;d<=daysInMonth;d++){
    const ds = currentYear+'-'+String(currentMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dow = (firstDay+d-1)%7;
    const dls  = dlMap[ds]  || [];
    const alms = almMap[ds] || [];
    const isToday = ds === todayStr;
    let cls = '';
    if(isToday) cls += ' today';
    if(dls.length) cls += ' has-deadline';
    else if(alms.length) cls += ' has-event';
    if(dow===0) cls += ' sun'; if(dow===6) cls += ' sat';

    const chips = [
      ...dls.slice(0,2).map(x=>`<div class="cal-event-chip chip-deadline">${escHtml(x.title)}</div>`),
      ...alms.slice(0,1).map(x=>`<div class="cal-event-chip chip-alarm">${escHtml(x.title)}</div>`),
    ].join('');

    html += `<div class="cal-cell${cls}" onclick="calCellClick('${ds}')">
      <span class="cal-day-num">${d}</span>
      <div class="cal-events">${chips}</div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('cal-grid-area').innerHTML = html;
  document.getElementById('cal-month-label').textContent = currentYear+'年 '+(currentMonth+1)+'月';
}

function calCellClick(ds) {
  document.getElementById('dl-date').value = ds;
  document.getElementById('al-date').value = ds;
}

document.getElementById('cal-prev').addEventListener('click', () => {
  if(--currentMonth < 0){ currentMonth=11; currentYear--; } renderCalendarGrid();
});
document.getElementById('cal-next').addEventListener('click', () => {
  if(++currentMonth > 11){ currentMonth=0; currentYear++; } renderCalendarGrid();
});

// ===== 締め切り =====
document.getElementById('deadline-form').addEventListener('submit', e => {
  e.preventDefault();
  const item = {
    id: 'd'+Date.now(),
    title:    document.getElementById('dl-title').value.trim(),
    datetime: toDatetimeStr(document.getElementById('dl-date').value, document.getElementById('dl-time').value),
    memo:     document.getElementById('dl-memo').value.trim(),
    done:     false, // 完了フラグ（他機能の完了合図と連携する場合はここを更新する）
  };
  if(!item.title || !item.datetime) return;
  const list = load(DL_KEY); list.push(item); save(DL_KEY, list);
  e.target.reset();
  renderDeadlineList(); renderCalendarGrid();
});

function renderDeadlineList() {
  const container = document.getElementById('deadline-list');
  const items = load(DL_KEY);
  if(!items.length){ container.innerHTML='<p class="item-empty">締め切りがまだありません</p>'; return; }
  const now = nowStr();
  const sorted = [...items].sort((a,b) => a.datetime.localeCompare(b.datetime));
  container.innerHTML = sorted.map(item => {
    const isPast = item.datetime < now;
    const isDone = !!item.done;
    return `<div class="deadline-item ${isPast&&!isDone?'past':''} ${isDone?'done':''}">
      <div class="item-icon">${isDone?'☑️':'📌'}</div>
      <div class="item-body">
        <div class="item-title">${escHtml(item.title)}${isDone?'':deadlineBadge(item.datetime)}</div>
        <div class="item-time">${displayDatetime(item.datetime)}</div>
        ${item.memo?`<div class="item-memo">${escHtml(item.memo)}</div>`:''}
      </div>
      <button class="item-complete ${isDone?'is-done':''}" onclick="toggleDeadlineDone('${item.id}')" title="${isDone?'未完了に戻す':'完了にする'}">${isDone?'↺':'✓'}</button>
      <button class="item-delete" onclick="deleteDeadline('${item.id}')">✕</button>
    </div>`;
  }).join('');
}

function deleteDeadline(id) {
  save(DL_KEY, load(DL_KEY).filter(x=>x.id!==id));
  renderDeadlineList(); renderCalendarGrid();
}

// 完了トグル（手動）。将来的に他機能の完了合図と連携する場合は、
// その合図を受け取った時にここと同じ処理（doneをtrueにしてsave）を呼べばよい。
function toggleDeadlineDone(id) {
  const list = load(DL_KEY).map(x => x.id===id ? {...x, done: !x.done} : x);
  save(DL_KEY, list);
  renderDeadlineList(); renderCalendarGrid();
}

// ===== アラーム =====
document.getElementById('alarm-form').addEventListener('submit', e => {
  e.preventDefault();
  const item = {
    id: 'a'+Date.now(),
    title:    document.getElementById('al-title').value.trim(),
    datetime: toDatetimeStr(document.getElementById('al-date').value, document.getElementById('al-time').value),
    repeat:   document.getElementById('al-repeat').value,
  };
  if(!item.title || !item.datetime) return;
  const list = load(ALM_KEY); list.push(item); save(ALM_KEY, list);
  e.target.reset();
  renderAlarmList(); renderCalendarGrid();
});

function renderAlarmList() {
  const container = document.getElementById('alarm-list');
  const items = load(ALM_KEY);
  if(!items.length){ container.innerHTML='<p class="item-empty">アラームがまだありません</p>'; return; }
  const now = nowStr();
  const sorted = [...items].sort((a,b) => a.datetime.localeCompare(b.datetime));
  const repLabel = {none:'',daily:'毎日',weekly:'毎週'};
  container.innerHTML = sorted.map(item => {
    const isPast = item.datetime < now;
    const fired  = firedAlarms.has(item.id);
    const rep    = repLabel[item.repeat]||'';
    return `<div class="alarm-item ${isPast?'past':''}">
      <div class="item-icon">${fired?'☑️':isPast?'⌛':'⏰'}</div>
      <div class="item-body">
        <div class="item-title">${escHtml(item.title)}</div>
        <div class="item-time">${displayDatetime(item.datetime)}${rep?' · '+rep:''}</div>
      </div>
      <button class="item-delete" onclick="deleteAlarm('${item.id}')">✕</button>
    </div>`;
  }).join('');
}

function deleteAlarm(id) {
  save(ALM_KEY, load(ALM_KEY).filter(x=>x.id!==id));
  firedAlarms.delete(id);
  renderAlarmList(); renderCalendarGrid();
}

// ===== アラームチェック =====
function checkAlarms() {
  const now = nowStr();
  load(ALM_KEY).forEach(alarm => {
    if(!firedAlarms.has(alarm.id) && alarm.datetime <= now){
      firedAlarms.add(alarm.id);
      save(FIRED_KEY, [...firedAlarms]);
      showAlarmBanner(alarm);
      if(Notification.permission==='granted')
        new Notification('⏰ '+alarm.title, {body:'アラームの時間です！'});
    }
  });
}

function showAlarmBanner(alarm) {
  // マイページ等に埋め込まれている場合、Calendarタブを見ていなくても気づけるように
  // 親ページへ通知する（親ページ側はどのタブにいてもバナーを表示する）
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({ type: 'tb-alarm-fired', title: alarm.title }, '*');
    } catch (e) { /* ignore */ }
  }

  const banner = document.getElementById('alarm-fire-banner');
  banner.innerHTML = `<div class="alarm-fire-card">
    <span class="alarm-fire-icon">⏰</span>
    <div class="alarm-fire-body">
      <strong>${escHtml(alarm.title)}</strong>
      <span>アラームの時間です！</span>
    </div>
    <button class="alarm-fire-dismiss" onclick="document.getElementById('alarm-fire-banner').classList.remove('active')">✕</button>
  </div>`;
  banner.classList.add('active');
  setTimeout(() => banner.classList.remove('active'), 12000);
}

if('Notification' in window && Notification.permission==='default') Notification.requestPermission();

// ===== 初期化 =====
renderCalendarGrid();
renderDeadlineList();
renderAlarmList();
setInterval(checkAlarms, 10000);
checkAlarms();
</script>
