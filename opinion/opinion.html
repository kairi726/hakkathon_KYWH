<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Idea Board</title>
<link rel="stylesheet" href="opinion.css">
</head>
<body>
<div class="wrap">
  <h1 class="board-title">Idea Board</h1>
  <p class="board-sub">思いついたことを付箋に書いて、みんなでリアクション・コメントしよう</p>
  <p class="shared-note">※ 付箋とリアクションはこのページを開いた全員に共有されます</p>

  <div class="columns">
    <div>
      <div class="notes" id="notes"></div>
      <div class="composer" id="composer" style="display:none;">
        <div class="composer-title">新しいアイデア</div>
        <div class="composer-editor" id="composerEditor" contenteditable="true" spellcheck="true" data-placeholder="ここに記入してください。絵文字も自由に使えます ✨"></div>
        <div class="composer-actions">
          <button class="composer-cancel" id="composerCancel" type="button">キャンセル</button>
          <button class="composer-save" id="composerSave" type="button">追加</button>
        </div>
      </div>
      <div class="add-note" id="addNoteBtn" style="margin-top:14px;">＋ 追加</div>
    </div>

    <div>
      <p class="col-heading">Memo</p>
      <div class="memo-panel">
        <div class="memo-toolbar">
          <button class="memo-btn" data-command="bold" title="太字" style="font-weight: bold;">B</button>
          <button class="memo-btn" data-command="createLink" title="リンク">🔗</button>
          <button class="memo-btn" data-command="insertUnorderedList" title="リスト">•</button>
        </div>
        <div class="link-input-wrapper" id="linkInputWrapper" style="display:none;">
          <input type="url" id="linkUrlInput" placeholder="https://example.com" />
          <button type="button" class="link-input-submit" id="linkSubmitBtn">追加</button>
          <button type="button" class="link-input-cancel" id="linkCancelBtn">キャンセル</button>
        </div>
        <div id="memo" class="memo-editor" contenteditable="true" spellcheck="true"></div>
        <div class="save-hint" id="memoHint"></div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK（compat版）。付箋・メモをカテゴリー内の全メンバーで共有するために使う -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="opinion.js"></script>
</body>
</html>
